[project]
name = "touchcib"
version = "0.1.0"
description = "A minimal Flask service for touchCIB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "openai>=1.109.0",
    "pandas>=2.3.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.7.0",
    "scipy>=1.18.1",
]


# ---------------------------------------------------------------- Pyright / Pylance
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__", ".venv", "**/artifacts"]
extraPaths = ["src"]
typeCheckingMode = "standard"
reportMissingImports = "error"
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportIndexIssue = "none"
reportAssignmentType = "none"
reportReturnType = "none"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "E501",      # 行长交给 formatter
    "RUF001",    # 字符串全角标点（中文注释是正确写法）
    "RUF002",    # docstring 全角标点
    "RUF003",    # 注释全角标点
]

[tool.ruff.lint.isort]
known-first-party = ["partA1serving"]
